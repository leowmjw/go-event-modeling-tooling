<svg xmlns="http://www.w3.org/2000/svg" width="1436" height="740" viewBox="0 0 1436 740"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs><style>text{font-family:sans-serif;fill:#222;font-size:12px}.box-title{font-weight:bold}.note text,.gwt text{font-size:11px}.code{font-family:monospace}.lane-label{font-weight:bold;font-size:13px}</style><g class="swimlane"><rect x="10" y="20" width="1415" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="44">UI/Automation</text></g><g class="swimlane"><rect x="10" y="160" width="1415" height="128" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="184">Command/Read Model</text></g><g class="swimlane"><rect x="10" y="308" width="1415" height="128" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="332">Events</text></g><path d="M 340.0 57.0 L 380.0 229.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 544.0 229.0 L 584.0 377.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 748.0 377.0 L 788.0 221.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="120" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">AddItemScreen</text></g><g class="box"><rect x="380" y="180" width="164" height="98" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="392" y="202">AddItem</text><text class="code" x="392" y="222">itemId: &#39;item-1&#39;</text><text class="code" x="392" y="238">  description: &#39;john&#39;</text><text class="code" x="392" y="254">  image: &#39;avatar_john&#39;</text><text class="code" x="392" y="270">  price: 20.4</text></g><g class="box"><rect x="584" y="328" width="164" height="98" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="596" y="350">ItemAdded</text><text class="code" x="596" y="370">itemId: &#39;item-1&#39;</text><text class="code" x="596" y="386">  description: &#39;john&#39;</text><text class="code" x="596" y="402">  image: &#39;avatar_john&#39;</text><text class="code" x="596" y="418">  price: 20.4</text></g><g class="box"><rect x="788" y="180" width="567" height="82" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="800" y="202">ItemCatalog</text><text class="code" x="800" y="222">items: [</text><text class="code" x="800" y="238">    { itemId: &#39;item-1&#39;, description: &#39;john&#39;, image: &#39;avatar_john&#39;, price: 20.4 }</text><text class="code" x="800" y="254">  ]</text></g><g class="gwt"><rect x="380" y="456" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="390" y="474">add a valid item</text><text class="box-title" x="390" y="494">Given</text><text x="390" y="509">evt ItemCatalogOpened { catalogId: &#39;catalog-1&#39; }</text><text class="box-title" x="390" y="524">When</text><text x="390" y="539">cmd AddItem { itemId: &#39;item-1&#39;, description: &#39;john&#39;, image: &#39;avatar_john&#39;, price: 20.4 }</text><text class="box-title" x="390" y="554">Then</text><text x="390" y="569">evt ItemAdded { itemId: &#39;item-1&#39;, description: &#39;john&#39;, image: &#39;avatar_john&#39;, price: 20.4 }</text></g><g class="gwt"><rect x="380" y="588" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="390" y="606">reject an item with a non-positive price</text><text class="box-title" x="390" y="626">Given</text><text x="390" y="641">evt ItemCatalogOpened { catalogId: &#39;catalog-1&#39; }</text><text class="box-title" x="390" y="656">When</text><text x="390" y="671">cmd AddItem { itemId: &#39;item-2&#39;, description: &#39;jane&#39;, image: &#39;avatar_jane&#39;, price: 0 }</text><text class="box-title" x="390" y="686">Then</text><text x="390" y="701">evt ItemAddRejected { itemId: &#39;item-2&#39;, reason: &#39;price_must_be_positive&#39; }</text></g></svg>