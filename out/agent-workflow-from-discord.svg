<svg xmlns="http://www.w3.org/2000/svg" width="10601" height="1472" viewBox="0 0 10601 1472"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs><style>text{font-family:sans-serif;fill:#222;font-size:12px}.box-title{font-weight:bold}.note text,.gwt text{font-size:11px}.code{font-family:monospace}.lane-label{font-weight:bold;font-size:13px}</style><g class="swimlane"><rect x="10" y="20" width="10580" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="44">UI/Automation</text></g><g class="swimlane"><rect x="10" y="160" width="10580" height="160" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="184">Command/Read Model</text></g><g class="swimlane"><rect x="10" y="340" width="10580" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="364">Events</text></g><g class="swimlane"><rect x="10" y="480" width="10580" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="504">Events: Conversation</text></g><g class="swimlane"><rect x="10" y="620" width="10580" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="644">Events: InvoiceSearch</text></g><path d="M 340.0 57.0 L 380.0 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 1537.6 205.0 L 1577.6 385.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2735.2 385.0 L 2775.2 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2924.4 57.0 L 2964.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3510.0 205.0 L 3550.0 525.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4681.2 525.0 L 4721.2 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4870.4 57.0 L 4910.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5499.2 205.0 L 5539.2 665.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5499.2 205.0 L 6031.2 665.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5991.2 665.0 L 6530.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 7474.4 665.0 L 7514.4 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 7678.8 57.0 L 7718.8 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 8422.8 205.0 L 8462.8 385.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 9166.8 385.0 L 9206.8 213.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 10215.6 665.0 L 10255.6 245.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="120" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">DiscordScreen</text></g><g class="box"><rect x="380" y="180" width="1158" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="392" y="202">AskQuestion</text><text class="code" x="392" y="222">conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34;</text></g><g class="box"><rect x="1578" y="360" width="1158" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1590" y="382">QuestionAsked</text><text class="code" x="1590" y="402">conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34;</text></g><g class="box"><rect x="2775" y="40" width="149" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="2787" y="62">SelectInvoiceTool</text></g><g class="box"><rect x="2964" y="180" width="546" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2976" y="202">RequestInvoiceSearch</text><text class="code" x="2976" y="222">conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34;</text></g><g class="box"><rect x="3550" y="500" width="546" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="3562" y="522">Conversation.InvoiceSearchRequested</text><text class="code" x="3562" y="542">conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34;</text></g><g class="box"><rect x="4136" y="500" width="546" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="4148" y="522">Conversation.InvoiceSearchRequested</text><text class="code" x="4148" y="542">conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34;</text></g><g class="box"><rect x="4721" y="40" width="149" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="4733" y="62">InvoiceRepository</text></g><g class="box"><rect x="4910" y="180" width="589" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4922" y="202">RecordInvoiceSearchResult</text><text class="code" x="4922" y="222">conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;], failureReason: &#34;&#34;</text></g><g class="box"><rect x="5539" y="640" width="452" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5551" y="662">InvoiceSearch.InvoicesFound</text><text class="code" x="5551" y="682">conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;]</text></g><g class="box"><rect x="6031" y="640" width="459" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="6043" y="662">InvoiceSearch.InvoiceSearchFailed</text><text class="code" x="6043" y="682">conversationId: &#34;conv-1001&#34;, reason: &#34;repository_unavailable&#34;</text></g><g class="box"><rect x="6530" y="180" width="452" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="6542" y="202">InvoiceSearchResult</text><text class="code" x="6542" y="222">conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;]</text></g><g class="box"><rect x="7022" y="640" width="452" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="7034" y="662">InvoiceSearch.InvoicesFound</text><text class="code" x="7034" y="682">conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;]</text></g><g class="box"><rect x="7514" y="40" width="164" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="7526" y="62">FormatInvoiceAnswer</text></g><g class="box"><rect x="7719" y="180" width="704" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="7731" y="202">RecordAnswer</text><text class="code" x="7731" y="222">conversationId: &#34;conv-1001&#34;, answer: &#34;2 invoices were sent out yesterday to customers X and Y.&#34;</text></g><g class="box"><rect x="8463" y="360" width="704" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="8475" y="382">AnswerRecorded</text><text class="code" x="8475" y="402">conversationId: &#34;conv-1001&#34;, answer: &#34;2 invoices were sent out yesterday to customers X and Y.&#34;</text></g><g class="box"><rect x="9207" y="180" width="510" height="66" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="9219" y="202">Answers</text><text class="code" x="9219" y="222">&#34;conversationId&#34;: &#34;conv-1001&#34;,</text><text class="code" x="9219" y="238">    &#34;answer&#34;: &#34;2 invoices were sent out yesterday to customers X and Y.&#34;</text></g><g class="box"><rect x="9756" y="640" width="459" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="9768" y="662">InvoiceSearch.InvoiceSearchFailed</text><text class="code" x="9768" y="682">conversationId: &#34;conv-1001&#34;, reason: &#34;repository_unavailable&#34;</text></g><g class="box"><rect x="10256" y="180" width="265" height="130" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="10268" y="202">SupportReviewInbox</text><text class="code" x="10268" y="222">&#34;items&#34;: [</text><text class="code" x="10268" y="238">      {</text><text class="code" x="10268" y="254">        &#34;conversationId&#34;: &#34;conv-1001&#34;,</text><text class="code" x="10268" y="270">        &#34;reason&#34;: &#34;repository_unavailable&#34;</text><text class="code" x="10268" y="286">      }</text><text class="code" x="10268" y="302">    ]</text></g><g class="note"><rect x="2775" y="760" width="220" height="90" rx="4" fill="#fff6cc" stroke="#c9b458"/><text x="2785" y="778">Note for SelectInvoiceTool</text><text class="code" x="2785" y="796">classification: llm_judge</text><text class="code" x="2785" y="812">  decision: select one tool from [findInvoices]</text><text class="code" x="2785" y="828">  output: { tool: string, fromDate: date, toDate: date }</text><text class="code" x="2785" y="844">  The result must use only an allowed tool and must not invent arguments.</text></g><g class="note"><rect x="4721" y="862" width="220" height="122" rx="4" fill="#fff6cc" stroke="#c9b458"/><text x="4731" y="880">Note for InvoiceRepository</text><text class="code" x="4731" y="898">externalSystem: InvoiceRepository</text><text class="code" x="4731" y="914">  timeout: &#34;30s&#34;</text><text class="code" x="4731" y="930">  retry: { max: 2, backoff: exponential }</text><text class="code" x="4731" y="946">  Input: conversationId, fromDate, and toDate.</text><text class="code" x="4731" y="962">  Success output: conversationId, count, customers, and empty failureReason.</text><text class="code" x="4731" y="978">  Retry-exhausted output: conversationId, count 0, empty customers, and failureReason repository_unavailable.</text></g><g class="note"><rect x="7514" y="996" width="220" height="90" rx="4" fill="#fff6cc" stroke="#c9b458"/><text x="7524" y="1014">Note for FormatInvoiceAnswer</text><text class="code" x="7524" y="1032">classification: pure_function</text><text class="code" x="7524" y="1048">  Format count and customer names from InvoicesFound.</text><text class="code" x="7524" y="1064">  Singular uses &#34;invoice was&#34;; plural uses &#34;invoices were&#34;.</text><text class="code" x="7524" y="1080">  Preserve customer order from the event.</text></g><g class="note"><rect x="10256" y="1098" width="220" height="58" rx="4" fill="#fff6cc" stroke="#c9b458"/><text x="10266" y="1116">Note for SupportReviewInbox</text><text class="code" x="10266" y="1134">Support staff review this inbox from their support screen every morning.</text><text class="code" x="10266" y="1150">  The morning review is an operator cadence, not a workflow timer.</text></g><g class="gwt"><rect x="380" y="1188" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="390" y="1206">accept a Discord invoice question</text><text class="box-title" x="390" y="1226">Given</text><text x="390" y="1241">rmo Answers { conversationId: &#34;conv-1001&#34;, answers: [] }</text><text class="box-title" x="390" y="1256">When</text><text x="390" y="1271">cmd AskQuestion { conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34; }</text><text class="box-title" x="390" y="1286">Then</text><text x="390" y="1301">evt QuestionAsked { conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34; }</text></g><g class="gwt"><rect x="2775" y="1188" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="2785" y="1206">select the bounded invoice-search tool</text><text class="box-title" x="2785" y="1226">Given</text><text x="2785" y="1241">evt QuestionAsked { conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34; }</text><text class="box-title" x="2785" y="1256">When</text><text x="2785" y="1271">pcr SelectInvoiceTool { conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34; }</text><text class="box-title" x="2785" y="1286">Then</text><text x="2785" y="1301">cmd RequestInvoiceSearch { conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34; }</text></g><g class="gwt"><rect x="2964" y="1188" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="2974" y="1206">request yesterday&#39;s invoices after selecting findInvoices</text><text class="box-title" x="2974" y="1226">Given</text><text x="2974" y="1241">evt QuestionAsked { conversationId: &#34;conv-1001&#34;, question: &#34;How many invoices were sent out yesterday?&#34;, requestedAt: &#34;2026-09-20T13:00:00Z&#34;, businessTimezone: &#34;America/New_York&#34; }</text><text class="box-title" x="2974" y="1256">When</text><text x="2974" y="1271">cmd RequestInvoiceSearch { conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34; }</text><text class="box-title" x="2974" y="1286">Then</text><text x="2974" y="1301">evt Conversation.InvoiceSearchRequested { conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34; }</text></g><g class="gwt"><rect x="7514" y="1188" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="7524" y="1206">format the invoice result deterministically</text><text class="box-title" x="7524" y="1226">Given</text><text x="7524" y="1241">evt InvoiceSearch.InvoicesFound { conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;] }</text><text class="box-title" x="7524" y="1256">When</text><text x="7524" y="1271">pcr FormatInvoiceAnswer { conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;] }</text><text class="box-title" x="7524" y="1286">Then</text><text x="7524" y="1301">cmd RecordAnswer { conversationId: &#34;conv-1001&#34;, answer: &#34;2 invoices were sent out yesterday to customers X and Y.&#34; }</text></g><g class="gwt"><rect x="7719" y="1188" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="7729" y="1206">record the formatted invoice answer</text><text class="box-title" x="7729" y="1226">Given</text><text x="7729" y="1241">evt InvoiceSearch.InvoicesFound { conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;] }</text><text class="box-title" x="7729" y="1256">When</text><text x="7729" y="1271">cmd RecordAnswer { conversationId: &#34;conv-1001&#34;, answer: &#34;2 invoices were sent out yesterday to customers X and Y.&#34; }</text><text class="box-title" x="7729" y="1286">Then</text><text x="7729" y="1301">evt AnswerRecorded { conversationId: &#34;conv-1001&#34;, answer: &#34;2 invoices were sent out yesterday to customers X and Y.&#34; }</text></g><g class="gwt"><rect x="4910" y="1188" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4920" y="1206">record invoices found by the repository</text><text class="box-title" x="4920" y="1226">Given</text><text x="4920" y="1241">evt Conversation.InvoiceSearchRequested { conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34; }</text><text class="box-title" x="4920" y="1256">When</text><text x="4920" y="1271">cmd RecordInvoiceSearchResult { conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;], failureReason: &#34;&#34; }</text><text class="box-title" x="4920" y="1286">Then</text><text x="4920" y="1301">evt InvoiceSearch.InvoicesFound { conversationId: &#34;conv-1001&#34;, count: 2, customers: [&#34;X&#34;, &#34;Y&#34;] }</text></g><g class="gwt"><rect x="4910" y="1320" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4920" y="1338">route repository failure to support after retries</text><text class="box-title" x="4920" y="1358">Given</text><text x="4920" y="1373">evt Conversation.InvoiceSearchRequested { conversationId: &#34;conv-1001&#34;, fromDate: &#34;2026-09-19&#34;, toDate: &#34;2026-09-19&#34; }</text><text class="box-title" x="4920" y="1388">When</text><text x="4920" y="1403">cmd RecordInvoiceSearchResult { conversationId: &#34;conv-1001&#34;, count: 0, customers: [], failureReason: &#34;repository_unavailable&#34; }</text><text class="box-title" x="4920" y="1418">Then</text><text x="4920" y="1433">evt InvoiceSearch.InvoiceSearchFailed { conversationId: &#34;conv-1001&#34;, reason: &#34;repository_unavailable&#34; }</text></g></svg>