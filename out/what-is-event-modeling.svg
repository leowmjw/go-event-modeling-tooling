 4269.2 205.0 L 4309.2 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4559.6 353.0 L 4599.6 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4749.2 205.0 L 4789.2 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4909.2 57.0 L 4949.2 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5084.4 205.0 L 5124.4 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5562.0 353.0 L 5602.0 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5743.6 57.0 L 5783.6 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6091.6 205.0 L 6131.6 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6439.6 353.0 L 6479.6 221.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="149" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">SearchRoomsScreen</text></g><g class="box"><rect x="409" y="180" width="488" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="421" y="202">SearchRooms</text><text class="code" x="421" y="222">roomType: &#34;double&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34;</text></g><g class="box"><rect x="937" y="328" width="1287" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="949" y="350">RoomsSearched</text><text class="code" x="949" y="370">roomType: &#34;double&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34;, rooms: [{ id: &#34;r-42&#34;, type: &#34;double&#34;, price: 100 }, { id: &#34;r-55&#34;, type: &#34;double&#34;, price: 110 }], available: 2</text></g><g class="box"><rect x="2264" y="180" width="322" height="98" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2276" y="202">RoomList</text><text class="code" x="2276" y="222">rooms: [</text><text class="code" x="2276" y="238">    { id: &#34;r-42&#34;, type: &#34;double&#34;, price: 100 }</text><text class="code" x="2276" y="254">    { id: &#34;r-55&#34;, type: &#34;double&#34;, price: 110 }</text><text class="code" x="2276" y="270">  ]</text></g><g class="box"><rect x="2627" y="40" width="126" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="2639" y="62">BookRoomScreen</text></g><g class="box"><rect x="2793" y="180" width="704" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2805" y="202">BookRoom</text><text class="code" x="2805" y="222">bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34;, guestId: &#34;g-7&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34;</text></g><g class="box"><rect x="3537" y="328" width="178" height="114" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="3549" y="350">RoomBooked</text><text class="code" x="3549" y="370">bookingId: &#34;b-1&#34;</text><text class="code" x="3549" y="386">  roomId: &#34;r-42&#34;</text><text class="code" x="3549" y="402">  guestId: &#34;g-7&#34;</text><text class="code" x="3549" y="418">  checkIn: &#34;2024-06-01&#34;</text><text class="code" x="3549" y="434">  checkOut: &#34;2024-06-05&#34;</text></g><g class="box"><rect x="3756" y="180" width="178" height="98" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="3768" y="202">BookingConfirmation</text><text class="code" x="3768" y="222">bookingId: &#34;b-1&#34;</text><text class="code" x="3768" y="238">  roomId: &#34;r-42&#34;</text><text class="code" x="3768" y="254">  checkIn: &#34;2024-06-01&#34;</text><text class="code" x="3768" y="270">  checkOut: &#34;2024-06-05&#34;</text></g><g class="box"><rect x="3974" y="40" width="120" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="3986" y="62">CheckInDesk</text></g><g class="box"><rect x="4134" y="180" width="135" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4146" y="202">CheckIn</text><text class="code" x="4146" y="222">bookingId: &#34;b-1&#34;</text></g><g class="box"><rect x="4309" y="328" width="250" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="4321" y="350">GuestCheckedIn</text><text class="code" x="4321" y="370">bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34;</text></g><g class="box"><rect x="4600" y="180" width="150" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4612" y="202">RoomStatus</text><text class="code" x="4612" y="222">status: &#34;occupied&#34;</text></g><g class="box"><rect x="4789" y="40" width="120" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="4801" y="62">CheckOutDesk</text></g><g class="box"><rect x="4949" y="180" width="135" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4961" y="202">CheckOut</text><text class="code" x="4961" y="222">bookingId: &#34;b-1&#34;</text></g><g class="box"><rect x="5124" y="328" width="438" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5136" y="350">GuestCheckedOut</text><text class="code" x="5136" y="370">bookingId: &#34;b-1&#34;, nights: 4, nightlyRate: 100, amount: 400</text></g><g class="box"><rect x="5602" y="40" width="142" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="5614" y="62">BillingProcessor</text></g><g class="box"><rect x="5784" y="180" width="308" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="5796" y="202">TakePayment</text><text class="code" x="5796" y="222">bookingId: &#34;b-1&#34;, nights: 4, amount: 400</text></g><g class="box"><rect x="6132" y="328" width="308" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="6144" y="350">PaymentTaken</text><text class="code" x="6144" y="370">bookingId: &#34;b-1&#34;, nights: 4, amount: 400</text></g><g class="box"><rect x="6480" y="180" width="135" height="82" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="6492" y="202">Invoice</text><text class="code" x="6492" y="222">bookingId: &#34;b-1&#34;</text><text class="code" x="6492" y="238">  nights: 4</text><text class="code" x="6492" y="254">  amount: 400</text></g><g class="gwt"><rect x="409" y="472" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="419" y="490">search available rooms</text><text class="box-title" x="419" y="510">Given</text><text x="419" y="525">evt HotelInventoryLoaded { hotelId: &#34;hotel-1&#34; }</text><text class="box-title" x="419" y="540">When</text><text x="419" y="555">cmd SearchRooms { roomType: &#34;double&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34; }</text><text class="box-title" x="419" y="570">Then</text><text x="419" y="585">evt RoomsSearched { roomType: &#34;double&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34;, rooms: [{ id: &#34;r-42&#34;, type: &#34;double&#34;, price: 100 }, { id: &#34;r-55&#34;, type: &#34;double&#34;, price: 110 }], available: 2 }</text></g><g class="gwt"><rect x="2793" y="472" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="2803" y="490">book available room</text><text class="box-title" x="2803" y="510">Given</text><text x="2803" y="525">evt RoomsSearched { roomType: &#34;double&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34;, rooms: [{ id: &#34;r-42&#34;, type: &#34;double&#34;, price: 100 }], available: 1 }</text><text class="box-title" x="2803" y="540">When</text><text x="2803" y="555">cmd BookRoom { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34;, guestId: &#34;g-7&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34; }</text><text class="box-title" x="2803" y="570">Then</text><text x="2803" y="585">evt RoomBooked { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34;, guestId: &#34;g-7&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34; }</text></g><g class="gwt"><rect x="2793" y="604" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="2803" y="622">reject unavailable room</text><text class="box-title" x="2803" y="642">Given</text><text x="2803" y="657">evt RoomsSearched { roomType: &#34;double&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34;, rooms: [], available: 0 }</text><text class="box-title" x="2803" y="672">When</text><text x="2803" y="687">cmd BookRoom { bookingId: &#34;b-2&#34;, roomId: &#34;r-42&#34;, guestId: &#34;g-8&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34; }</text><text class="box-title" x="2803" y="702">Then</text><text x="2803" y="717">evt RoomBookingRejected { bookingId: &#34;b-2&#34;, roomId: &#34;r-42&#34;, reason: &#34;room_unavailable&#34; }</text></g><g class="gwt"><rect x="4134" y="472" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4144" y="490">check in guest</text><text class="box-title" x="4144" y="510">Given</text><text x="4144" y="525">evt RoomBooked { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34;, guestId: &#34;g-7&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34; }</text><text class="box-title" x="4144" y="540">When</text><text x="4144" y="555">cmd CheckIn { bookingId: &#34;b-1&#34; }</text><text class="box-title" x="4144" y="570">Then</text><text x="4144" y="585">evt GuestCheckedIn { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34; }</text></g><g class="gwt"><rect x="4134" y="604" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4144" y="622">reject duplicate check in</text><text class="box-title" x="4144" y="642">Given</text><text x="4144" y="657">evt GuestCheckedIn { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34; }</text><text class="box-title" x="4144" y="672">When</text><text x="4144" y="687">cmd CheckIn { bookingId: &#34;b-1&#34; }</text><text class="box-title" x="4144" y="702">Then</text><text x="4144" y="717">evt GuestCheckInRejected { bookingId: &#34;b-1&#34;, reason: &#34;already_checked_in&#34; }</text></g><g class="gwt"><rect x="4949" y="472" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4959" y="490">check out a checked-in guest</text><text class="box-title" x="4959" y="510">Given</text><text x="4959" y="525">evt GuestCheckedIn { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34; }</text><text class="box-title" x="4959" y="540">When</text><text x="4959" y="555">cmd CheckOut { bookingId: &#34;b-1&#34; }</text><text class="box-title" x="4959" y="570">Then</text><text x="4959" y="585">evt GuestCheckedOut { bookingId: &#34;b-1&#34;, nights: 4, nightlyRate: 100, amount: 400 }</text></g><g class="gwt"><rect x="4949" y="604" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4959" y="622">reject checkout before check in</text><text class="box-title" x="4959" y="642">Given</text><text x="4959" y="657">evt RoomBooked { bookingId: &#34;b-1&#34;, roomId: &#34;r-42&#34;, guestId: &#34;g-7&#34;, checkIn: &#34;2024-06-01&#34;, checkOut: &#34;2024-06-05&#34; }</text><text class="box-title" x="4959" y="672">When</text><text x="4959" y="687">cmd CheckOut { bookingId: &#34;b-1&#34; }</text><text class="box-title" x="4959" y="702">Then</text><text x="4959" y="717">evt GuestCheckOutRejected { bookingId: &#34;b-1&#34;, reason: &#34;not_checked_in&#34; }</text></g><g class="gwt"><rect x="5602" y="472" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5612" y="490">prepare payment from checkout totals</text><text class="box-title" x="5612" y="510">Given</text><text x="5612" y="525">evt GuestCheckedOut { bookingId: &#34;b-1&#34;, nights: 4, nightlyRate: 100, amount: 400 }</text><text class="box-title" x="5612" y="540">When</text><text x="5612" y="555">cmd TakePayment { bookingId: &#34;b-1&#34;, nights: 4, amount: 400 }</text><text class="box-title" x="5612" y="570">Then</text><text x="5612" y="585">evt PaymentRequested { bookingId: &#34;b-1&#34;, nights: 4, amount: 400 }</text></g><g class="gwt"><rect x="5784" y="472" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5794" y="490">payment on check out</text><text class="box-title" x="5794" y="510">Given</text><text x="5794" y="525">evt GuestCheckedOut { bookingId: &#34;b-1&#34;, nights: 4, nightlyRate: 100, amount: 400 }</text><text class="box-title" x="5794" y="540">When</text><text x="5794" y="555">cmd TakePayment { bookingId: &#34;b-1&#34;, nights: 4, amount: 400 }</text><text class="box-title" x="5794" y="570">Then</text><text x="5794" y="585">evt PaymentTaken { bookingId: &#34;b-1&#34;, nights: 4, amount: 400 }</text></g><g class="gwt"><rect x="5784" y="604" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5794" y="622">reject non-positive payment</text><text class="box-title" x="5794" y="642">Given</text><text x="5794" y="657">evt GuestCheckedOut { bookingId: &#34;b-1&#34;, nights: 4, nightlyRate: 100, amount: 400 }</text><text class="box-title" x="5794" y="672">When</text><text x="5794" y="687">cmd TakePayment { bookingId: &#34;b-1&#34;, nights: 4, amount: 0 }</text><text class="box-title" x="5794" y="702">Then</text><text x="5794" y="717">evt PaymentRejected { bookingId: &#34;b-1&#34;, reason: &#34;amount_must_be_positive&#34; }</text></g></svg>