<svg xmlns="http://www.w3.org/2000/svg" width="2533" height="1052" viewBox="0 0 2533 1052"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs><style>text{font-family:sans-serif;fill:#222;font-size:12px}.box-title{font-weight:bold}.note text,.gwt text{font-size:11px}.code{font-family:monospace}.lane-label{font-weight:bold;font-size:13px}</style><g class="swimlane"><rect x="10" y="20" width="2512" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="44">UI/Automation</text></g><g class="swimlane"><rect x="10" y="160" width="2512" height="160" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="184">Command/Read Model</text></g><g class="swimlane"><rect x="10" y="340" width="2512" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="364">Events</text></g><path d="M 369.2 57.0 L 786.0 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 1410.8 205.0 L 1450.8 385.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 1967.6 385.0 L 2007.6 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="149" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">SearchRoomsScreen</text></g><g class="box"><rect x="409" y="180" width="337" height="130" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="421" y="202">AvailableRooms</text><text class="code" x="421" y="222">checkIn: &#34;2024-07-01&#34;</text><text class="code" x="421" y="238">  checkOut: &#34;2024-07-04&#34;</text><text class="code" x="421" y="254">  rooms: [</text><text class="code" x="421" y="270">    { roomId: &#34;room-12&#34;, rate: 180.00, beds: 1 }</text><text class="code" x="421" y="286">    { roomId: &#34;room-31&#34;, rate: 240.00, beds: 2 }</text><text class="code" x="421" y="302">  ]</text></g><g class="box"><rect x="786" y="180" width="625" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="798" y="202">BookRoom</text><text class="code" x="798" y="222">roomId: &#34;room-12&#34;, guestId: &#34;guest-7&#34;, checkIn: &#34;2024-07-01&#34;, checkOut: &#34;2024-07-04&#34;</text></g><g class="box"><rect x="1451" y="360" width="517" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1463" y="382">RoomBooked</text><text class="code" x="1463" y="402">bookingId: &#34;bk-900&#34;, roomId: &#34;room-12&#34;, guestId: &#34;guest-7&#34;, nights: 3</text></g><g class="box"><rect x="2008" y="180" width="445" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2020" y="202">BookingConfirmation</text><text class="code" x="2020" y="222">bookingId: &#34;bk-900&#34;, roomId: &#34;room-12&#34;, status: &#34;confirmed&#34;</text></g><g class="note"><rect x="786" y="480" width="220" height="58" rx="4" fill="#fff6cc" stroke="#c9b458"/><text x="796" y="498">Note for BookRoom</text><text class="code" x="796" y="516"># Settled</text><text class="code" x="796" y="532">  Rate is locked at search time, not at booking time.</text></g><g class="gwt"><rect x="786" y="570" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="796" y="588">book an available room</text><text class="box-title" x="796" y="608">Given</text><text x="796" y="623">evt RoomListed { roomId: &#34;room-12&#34;, rate: 180.00 }</text><text class="box-title" x="796" y="638">When</text><text x="796" y="653">cmd BookRoom { roomId: &#34;room-12&#34;, guestId: &#34;guest-7&#34;, checkIn: &#34;2024-07-01&#34;, checkOut: &#34;2024-07-04&#34; }</text><text class="box-title" x="796" y="668">Then</text><text x="796" y="683">evt RoomBooked { bookingId: &#34;bk-900&#34;, roomId: &#34;room-12&#34;, nights: 3 }</text></g><g class="gwt"><rect x="786" y="702" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="796" y="720">reject booking for an already-booked room</text><text class="box-title" x="796" y="740">Given</text><text x="796" y="755">evt RoomBooked { bookingId: &#34;bk-899&#34;, roomId: &#34;room-12&#34;, nights: 2 }</text><text class="box-title" x="796" y="770">When</text><text x="796" y="785">cmd BookRoom { roomId: &#34;room-12&#34;, guestId: &#34;guest-9&#34;, checkIn: &#34;2024-07-01&#34;, checkOut: &#34;2024-07-04&#34; }</text><text class="box-title" x="796" y="800">Then</text><text x="796" y="815">evt RoomBookingRejected { roomId: &#34;room-12&#34;, reason: &#34;already_booked&#34; }</text></g><g class="hotspot"><rect x="786" y="854" width="220" height="42" rx="4" fill="#ffcccc" stroke="#c95c5c"/><text x="796" y="872">Hotspot for BookRoom</text><text class="code" x="796" y="890">concurrent booking on the same room: last write wins, or reject the second?</text></g><g class="hotspot"><rect x="786" y="908" width="220" height="58" rx="4" fill="#ffcccc" stroke="#c95c5c"/><text x="796" y="926">Hotspot for BookRoom</text><text class="code" x="796" y="944">Does an **overbooking** emit a rejection event, or is it silently queued</text><text class="code" x="796" y="960">  for the front desk to resolve manually?</text></g><g class="hotspot"><rect x="2008" y="978" width="220" height="42" rx="4" fill="#ffcccc" stroke="#c95c5c"/><text x="2018" y="996">Hotspot for BookingConfirmation</text><text class="code" x="2018" y="1014">is BookingConfirmation readable before payment settles, or only after?</text></g></svg>