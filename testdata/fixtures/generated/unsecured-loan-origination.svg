ke="#90a4ae"/><text class="slice-label" x="5651" y="531">Manual-review queue UI</text><text class="slice-status" x="6780" y="531">Planned</text></g><g class="slice"><rect x="7150" y="542" width="1330" height="22" rx="3" fill="#eceff1" stroke="#90a4ae"/><text class="slice-label" x="7158" y="557">Co-applicant flow</text><text class="slice-status" x="8390" y="557">Planned</text></g><g class="slice"><rect x="5643" y="568" width="2837" height="22" rx="3" fill="#fff59d" stroke="#f9a825"/><text class="slice-label" x="5651" y="583">Joint-account servicing handoff</text><text class="slice-status" x="8390" y="583">Informational</text></g><g class="hotspot"><rect x="4846" y="610" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="4856" y="628">Hotspot for DTIAssessed</text><text class="code" x="4856" y="646">At DTI &gt; 43%, do we decline or offer reduced principal? Credit</text><text class="code" x="4856" y="662">  policy differs from product team expectation. Affects EvaluateDTI</text><text class="code" x="4856" y="678">  (frame 15) and DecisionReasoning defaults.</text></g><g class="hotspot"><rect x="6440" y="696" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="6450" y="714">Hotspot for LoanApproved</text><text class="code" x="6450" y="732">Manual-review SLA: 4 hours or 24 hours? Operations currently 4h,</text><text class="code" x="6450" y="748">  but backlog says 24h is realistic. Affects ops staffing and the</text><text class="code" x="6450" y="764">  service-level objective surfaced on the underwriter dashboard.</text></g><g class="hotspot"><rect x="3771" y="782" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="3781" y="800">Hotspot for HardPullCredit</text><text class="code" x="3781" y="818">Hard pull consent capture today is implicit via the form. Should</text><text class="code" x="3781" y="834">  it be an explicit checkbox per FCRA Section 604? Compliance flagged</text><text class="code" x="3781" y="850">  in Q3 review but no ticket exists yet.</text></g><circle class="hotspot-pin" cx="5139" cy="352" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="6862" cy="352" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="4049" cy="188" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><g class="gwt"><rect x="708" y="888" width="240" height="180" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="718" y="906">happy path: applicant is prequalified and approved</text><text class="box-title" x="718" y="926">Given</text><text x="718" y="941">ui LoanApplicationScreen</text><text class="box-title" x="718" y="956">When</text><text x="718" y="971">cmd SubmitLoanApplication { requestedAmount: 15000 }</text><text class="box-title" x="718" y="986">Then</text><text x="718" y="1001">evt LoanApplicationSubmitted</text><text x="718" y="1016">evt SoftPullCompleted { prequalified: true }</text><text x="718" y="1031">evt HardPullCompleted { hardScore: 720 }</text><text x="718" y="1046">evt DTIAssessed { dti: 0.31 }</text><text x="718" y="1061">evt LoanApproved { approvedAmount: 15000, apr: 0.1199 }</text></g><g class="gwt"><rect x="5643" y="888" width="240" height="165" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5653" y="906">decline when DTI breaches policy ceiling</text><text class="box-title" x="5653" y="926">Given</text><text x="5653" y="941">evt HardPullCompleted { hardScore: 680 }</text><text x="5653" y="956">evt DTIAssessed { dti: 0.51 }</text><text class="box-title" x="5653" y="971">When</text><text x="5653" y="986">cmd EvaluateDTI</text><text class="box-title" x="5653" y="1001">Then</text><text x="5653" y="1016">rmo DecisionReasoning { policyFailures: [&#34;DTI_OVER_43&#34;] }</text><text x="5653" y="1031">cmd DeclineLoan { reasonCode: &#34;dti_over_policy&#34; }</text><text x="5653" y="1046">evt LoanDeclined { reasonCode: &#34;dti_over_policy&#34; }</text></g></svg>