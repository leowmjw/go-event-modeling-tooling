e"><rect x="10" y="160" width="8042" height="128" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="184">Command/Read Model</text></g><g class="swimlane"><rect x="10" y="308" width="8042" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="332">Events</text></g><g class="swimlane"><rect x="10" y="448" width="8042" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="472">Events: External</text></g><path d="M 346.4 57.0 L 554.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 999.2 205.0 L 1039.2 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 1731.2 493.0 L 1771.2 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2456.8 353.0 L 2496.8 229.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2173.6 353.0 L 2794.4 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2936.0 57.0 L 2976.0 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3168.8 205.0 L 3208.8 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3495.2 353.0 L 3904.8 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3864.8 493.0 L 3904.8 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4430.8 353.0 L 4470.8 229.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4054.0 57.0 L 4728.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5029.2 205.0 L 5069.2 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4054.0 57.0 L 5431.6 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5804.4 205.0 L 5844.4 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6558.0 493.0 L 6598.0 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6762.4 57.0 L 6802.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6762.4 57.0 L 7064.0 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 7386.4 205.0 L 7426.4 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 7386.4 205.0 L 7688.0 353.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="126" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">CheckoutScreen</text></g><g class="box"><rect x="386" y="180" width="128" height="82" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="398" y="202">CartTotal</text><text class="code" x="398" y="222">cartId: &#34;c-100&#34;</text><text class="code" x="398" y="238">  total: 125.00</text><text class="code" x="398" y="254">  currency: &#34;USD&#34;</text></g><g class="box"><rect x="554" y="180" width="445" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="566" y="202">AuthorizeCardPayment</text><text class="code" x="566" y="222">amount, currency, cardToken, merchantId, threeDSChallengeId</text></g><g class="box"><rect x="1039" y="328" width="322" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1051" y="350">CardAuthorizationRequested</text><text class="code" x="1051" y="370">paymentId, amount, merchantId, requestedAt</text></g><g class="box"><rect x="1402" y="468" width="330" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1414" y="490">External.NetworkResponse</text><text class="code" x="1414" y="510">paymentId, authCode, responseCode, issuerId</text></g><g class="box"><rect x="1771" y="40" width="126" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="1783" y="62">AuthTranslator</text></g><g class="box"><rect x="1938" y="328" width="236" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1950" y="350">CardAuthorized</text><text class="code" x="1950" y="370">paymentId, authCode, expiresAt</text></g><g class="box"><rect x="2214" y="328" width="243" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="2226" y="350">CardDeclined</text><text class="code" x="2226" y="370">paymentId, responseCode, reason</text></g><g class="box"><rect x="2497" y="180" width="258" height="98" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2509" y="202">AuthorizationLedger</text><text class="code" x="2509" y="222">paymentId: &#34;pay-9901&#34;</text><text class="code" x="2509" y="238">  authCode: &#34;auth-1&#34;</text><text class="code" x="2509" y="254">  authorizedAmount: 125.00</text><text class="code" x="2509" y="270">  expiresAt: &#34;2024-06-22T14:30:00Z&#34;</text></g><g class="box"><rect x="2794" y="40" width="142" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="2806" y="62">CaptureScheduler</text></g><g class="box"><rect x="2976" y="180" width="193" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2988" y="202">CapturePayment</text><text class="code" x="2988" y="222">paymentId, captureAmount</text></g><g class="box"><rect x="3209" y="328" width="286" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="3221" y="350">PaymentCaptured</text><text class="code" x="3221" y="370">paymentId, capturedAmount, capturedAt</text></g><g class="box"><rect x="3535" y="468" width="330" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="3547" y="490">External.SettlementFileBatch</text><text class="code" x="3547" y="510">batchId, valueDate, recordCount, totalValue</text></g><g class="box"><rect x="3905" y="40" width="149" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="3917" y="62">ClearingProcessor</text></g><g class="box"><rect x="4094" y="328" width="337" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="4106" y="350">ClearingCompleted</text><text class="code" x="4106" y="370">batchId, clearedCount, totalValue, clearedAt</text></g><g class="box"><rect x="4471" y="180" width="218" height="98" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4483" y="202">MerchantSettlementPosition</text><text class="code" x="4483" y="222">merchantId: &#34;mer-42&#34;</text><text class="code" x="4483" y="238">  pendingAmount: 125.00</text><text class="code" x="4483" y="254">  valueDate: &#34;2024-06-16&#34;</text><text class="code" x="4483" y="270">  currency: &#34;USD&#34;</text></g><g class="box"><rect x="4728" y="180" width="301" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4740" y="202">DisburseToMerchant</text><text class="code" x="4740" y="222">merchantId, amount, currency, valueDate</text></g><g class="box"><rect x="5069" y="328" width="322" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5081" y="350">MerchantPaid</text><text class="code" x="5081" y="370">merchantId, disbursementId, amount, paidAt</text></g><g class="box"><rect x="5432" y="180" width="373" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="5444" y="202">RefundPayment</text><text class="code" x="5444" y="222">paymentId, refundAmount, originalAuthCode, reason</text></g><g class="box"><rect x="5844" y="328" width="344" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5856" y="350">RefundIssued</text><text class="code" x="5856" y="370">paymentId, refundId, refundAmount, refundedAt</text></g><g class="box"><rect x="6228" y="468" width="330" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="6240" y="490">External.ChargebackFiled</text><text class="code" x="6240" y="510">chargebackId, paymentId, reasonCode, amount</text></g><g class="box"><rect x="6598" y="40" width="164" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="6610" y="62">ChargebackProcessor</text></g><g class="box"><rect x="6802" y="180" width="222" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="6814" y="202">AcceptChargeback</text><text class="code" x="6814" y="222">chargebackId, writeOffAmount</text></g><g class="box"><rect x="7064" y="180" width="322" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="7076" y="202">DisputeChargeback</text><text class="code" x="7076" y="222">chargebackId, reasonCode, evidenceBundleId</text></g><g class="box"><rect x="7426" y="328" width="222" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="7438" y="350">ChargebackAccepted</text><text class="code" x="7438" y="370">chargebackId, writeOffAmount</text></g><g class="box"><rect x="7688" y="328" width="294" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="7700" y="350">ChargebackDisputed</text><text class="code" x="7700" y="370">chargebackId, status: &#34;in_arbitration&#34;</text></g><g class="slice"><rect x="220" y="588" width="3275" height="22" rx="3" fill="#c8e6c9" stroke="#4caf50"/><text class="slice-label" x="228" y="603">Auth + capture</text><text class="slice-status" x="3405" y="603">Done</text></g><g class="slice"><rect x="3535" y="614" width="896" height="22" rx="3" fill="#bbdefb" stroke="#2196f3"/><text class="slice-label" x="3543" y="629">Clearing file ingest</text><text class="slice-status" x="4341" y="629">InProgress</text></g><g class="slice"><rect x="4471" y="640" width="921" height="22" rx="3" fill="#eceff1" stroke="#90a4ae"/><text class="slice-label" x="4479" y="655">Merchant disbursement</text><text class="slice-status" x="5302" y="655">Planned</text></g><g class="slice"><rect x="5432" y="666" width="757" height="22" rx="3" fill="#eceff1" stroke="#90a4ae"/><text class="slice-label" x="5440" y="681">Refund flow</text><text class="slice-status" x="6098" y="681">Planned</text></g><g class="slice"><rect x="6228" y="692" width="1420" height="22" rx="3" fill="#fff59d" stroke="#f9a825"/><text class="slice-label" x="6236" y="707">Chargeback intake</text><text class="slice-status" x="7558" y="707">Informational</text></g><g class="hotspot"><rect x="2976" y="734" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="2986" y="752">Hotspot for CapturePayment</text><text class="code" x="2986" y="770">When do we capture — at auth+24h, or at fulfilment? Operations</text><text class="code" x="2986" y="786">  wants immediate to free interchange capacity; Finance wants T+1</text><text class="code" x="2986" y="802">  to align with their nightly GL posting. Defaults to T+1 today.</text></g><g class="hotspot"><rect x="6802" y="820" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="6812" y="838">Hotspot for AcceptChargeback</text><text class="code" x="6812" y="856">Reason-code VISA 4837 (no cardholder authorization) — auto-accept</text><text class="code" x="6812" y="872">  or always dispute? Compliance needs a written decision; Operations</text><text class="code" x="6812" y="888">  wants auto-accept to keep dispute queue small.</text></g><g class="hotspot"><rect x="4094" y="906" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="4104" y="924">Hotspot for ClearingCompleted</text><text class="code" x="4104" y="942">Settlement file arrives daily at 06:00 UTC. If the file is late we</text><text class="code" x="4104" y="958">  block all downstream disbursements. Should we fall back to a vendor</text><text class="code" x="4104" y="974">  CSV pull when the batch is missing by 07:00? Not modelled today.</text></g><circle class="hotspot-pin" cx="7016" cy="188" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="4423" cy="336" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="3161" cy="188" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><g class="gwt"><rect x="554" y="1012" width="240" height="180" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="564" y="1030">happy path: card authorized, captured, settled</text><text class="box-title" x="564" y="1050">Given</text><text x="564" y="1065">ui CheckoutScreen</text><text class="box-title" x="564" y="1080">When</text><text x="564" y="1095">cmd AuthorizeCardPayment { amount: 125.00, cardToken: &#34;tok_visa_1&#34; }</text><text class="box-title" x="564" y="1110">Then</text><text x="564" y="1125">evt CardAuthorizationRequested</text><text x="564" y="1140">evt CardAuthorized { authCode: &#34;auth-1&#34; }</text><text x="564" y="1155">evt PaymentCaptured { capturedAmount: 125.00 }</text><text x="564" y="1170">evt ClearingCompleted { totalValue: 125.00 }</text><text x="564" y="1185">evt MerchantPaid { amount: 125.00 }</text></g><g class="gwt"><rect x="554" y="1204" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="564" y="1222">decline on insufficient funds</text><text class="box-title" x="564" y="1242">Given</text><text x="564" y="1257">cmd AuthorizeCardPayment { amount: 9999.00 }</text><text class="box-title" x="564" y="1272">When</text><text x="564" y="1287">evt External.NetworkResponse { responseCode: &#34;51&#34; }</text><text class="box-title" x="564" y="1302">Then</text><text x="564" y="1317">evt CardDeclined { responseCode: &#34;51&#34;, reason: &#34;insufficient_funds&#34; }</text></g><g class="gwt"><rect x="5432" y="1012" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5442" y="1030">refund a captured payment</text><text class="box-title" x="5442" y="1050">Given</text><text x="5442" y="1065">evt PaymentCaptured { paymentId: &#34;pay-9901&#34; }</text><text class="box-title" x="5442" y="1080">When</text><text x="5442" y="1095">cmd RefundPayment { refundAmount: 25.00, reason: &#34;customer_return&#34; }</text><text class="box-title" x="5442" y="1110">Then</text><text x="5442" y="1125">evt RefundIssued { refundAmount: 25.00 }</text></g><g class="gwt"><rect x="6802" y="1012" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="6812" y="1030">accept a chargeback with write-off</text><text class="box-title" x="6812" y="1050">Given</text><text x="6812" y="1065">evt External.ChargebackFiled { reasonCode: &#34;4837&#34;, amount: 125.00 }</text><text class="box-title" x="6812" y="1080">When</text><text x="6812" y="1095">cmd AcceptChargeback { writeOffAmount: 125.00 }</text><text class="box-title" x="6812" y="1110">Then</text><text x="6812" y="1125">evt ChargebackAccepted { writeOffAmount: 125.00 }</text></g></svg>