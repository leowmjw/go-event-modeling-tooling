<svg xmlns="http://www.w3.org/2000/svg" width="7121" height="1080" viewBox="0 0 7121 1080"><defs><marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#444"/></marker></defs><style>text{font-family:sans-serif;fill:#222;font-size:12px}.box-title{font-weight:bold}.note text,.gwt text{font-size:11px}.code{font-family:monospace}.lane-label{font-weight:bold;font-size:13px}.chapter-label{font-weight:bold;font-size:12px}.chapter-range{font-size:10px;fill:#666}.slice-label{font-size:11px}.slice-status{font-size:10px;fill:#444}</style><g class="swimlane"><rect x="10" y="20" width="7100" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="44">UI/Automation</text></g><g class="swimlane"><rect x="10" y="160" width="7100" height="176" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="184">Command/Read Model</text></g><g class="swimlane"><rect x="10" y="356" width="7100" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="380">Events</text></g><g class="swimlane"><rect x="10" y="496" width="7100" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="520">Events: Sales</text></g><g class="swimlane"><rect x="10" y="636" width="7100" height="120" rx="6" fill="#fafafa" stroke="#e0e0e0"/><text class="lane-label" x="24" y="660">Events: Billing</text></g><path d="M 346.4 57.0 L 748.8 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 1143.2 205.0 L 1183.2 401.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 1599.2 401.0 L 1639.2 221.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2136.8 541.0 L 2176.8 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2326.0 57.0 L 2366.0 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 2810.8 205.0 L 2850.8 401.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3310.0 401.0 L 3350.0 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3962.8 681.0 L 4002.8 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4182.4 57.0 L 4222.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 4523.2 205.0 L 4563.2 401.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5015.2 401.0 L 5055.2 229.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5682.4 681.0 L 5722.4 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5917.2 57.0 L 5957.2 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6308.4 205.0 L 6348.4 401.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6699.6 401.0 L 6739.6 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="126" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">CheckoutScreen</text></g><g class="box"><rect x="386" y="180" width="322" height="146" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="398" y="202">CartSummary</text><text class="code" x="398" y="222">cartId: &#34;c-100&#34;</text><text class="code" x="398" y="238">  customerId: &#34;cust-7&#34;</text><text class="code" x="398" y="254">  items: [</text><text class="code" x="398" y="270">    { sku: &#34;sku-1&#34;, qty: 1, unitPrice: 75.00 }</text><text class="code" x="398" y="286">    { sku: &#34;sku-2&#34;, qty: 1, unitPrice: 50.00 }</text><text class="code" x="398" y="302">  ]</text><text class="code" x="398" y="318">  total: 125.00</text></g><g class="box"><rect x="749" y="180" width="394" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="761" y="202">PlaceOrder</text><text class="code" x="761" y="222">cartId: &#34;c-100&#34;, customerId: &#34;cust-7&#34;, total: 125.00</text></g><g class="box"><rect x="1183" y="376" width="416" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1195" y="398">OrderPlaced</text><text class="code" x="1195" y="418">orderId: &#34;ord-100&#34;, customerId: &#34;cust-7&#34;, total: 125.00</text></g><g class="box"><rect x="1639" y="180" width="200" height="82" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="1651" y="202">OrderStatus</text><text class="code" x="1651" y="222">orderId: &#34;ord-100&#34;</text><text class="code" x="1651" y="238">  customerId: &#34;cust-7&#34;</text><text class="code" x="1651" y="254">  status: &#34;pending_payment&#34;</text></g><g class="box"><rect x="1879" y="516" width="258" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1891" y="538">Sales.OrderPlaced</text><text class="code" x="1891" y="558">orderId: &#34;ord-100&#34;, total: 125.00</text></g><g class="box"><rect x="2177" y="40" width="149" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="2189" y="62">BillingTranslator</text></g><g class="box"><rect x="2366" y="180" width="445" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2378" y="202">AuthorizePayment</text><text class="code" x="2378" y="222">orderId: &#34;ord-100&#34;, amount: 125.00, paymentMethodId: &#34;pm-9&#34;</text></g><g class="box"><rect x="2851" y="376" width="459" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="2863" y="398">PaymentAuthorized</text><text class="code" x="2863" y="418">orderId: &#34;ord-100&#34;, authorizationId: &#34;auth-1&#34;, amount: 125.00</text></g><g class="box"><rect x="3350" y="180" width="308" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="3362" y="202">PaymentStatus</text><text class="code" x="3362" y="222">orderId: &#34;ord-100&#34;, status: &#34;authorized&#34;</text></g><g class="box"><rect x="3698" y="656" width="265" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="3710" y="678">Billing.PaymentAuthorized</text><text class="code" x="3710" y="698">orderId: &#34;ord-100&#34;, amount: 125.00</text></g><g class="box"><rect x="4003" y="40" width="180" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="4015" y="62">FulfillmentTranslator</text></g><g class="box"><rect x="4222" y="180" width="301" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4234" y="202">AllocateShipment</text><text class="code" x="4234" y="222">orderId: &#34;ord-100&#34;, warehouseId: &#34;wh-1&#34;</text></g><g class="box"><rect x="4563" y="376" width="452" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="4575" y="398">ShipmentAllocated</text><text class="code" x="4575" y="418">orderId: &#34;ord-100&#34;, shipmentId: &#34;sh-55&#34;, warehouseId: &#34;wh-1&#34;</text></g><g class="box"><rect x="5055" y="180" width="222" height="98" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="5067" y="202">ShipmentQueue</text><text class="code" x="5067" y="222">shipmentId: &#34;sh-55&#34;</text><text class="code" x="5067" y="238">  orderId: &#34;ord-100&#34;</text><text class="code" x="5067" y="254">  warehouseId: &#34;wh-1&#34;</text><text class="code" x="5067" y="270">  status: &#34;queued_for_picking&#34;</text></g><g class="box"><rect x="5317" y="656" width="366" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5329" y="678">Billing.PaymentDeclined</text><text class="code" x="5329" y="698">orderId: &#34;ord-100&#34;, reason: &#34;insufficient_funds&#34;</text></g><g class="box"><rect x="5722" y="40" width="195" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="5734" y="62">SalesRecoveryTranslator</text></g><g class="box"><rect x="5957" y="180" width="351" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="5969" y="202">CancelOrder</text><text class="code" x="5969" y="222">orderId: &#34;ord-100&#34;, reason: &#34;payment_declined&#34;</text></g><g class="box"><rect x="6348" y="376" width="351" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="6360" y="398">OrderCancelled</text><text class="code" x="6360" y="418">orderId: &#34;ord-100&#34;, reason: &#34;payment_declined&#34;</text></g><g class="box"><rect x="6740" y="180" width="301" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="6752" y="202">CancelledOrderStatus</text><text class="code" x="6752" y="222">orderId: &#34;ord-100&#34;, status: &#34;cancelled&#34;</text></g><g class="gwt"><rect x="749" y="776" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="759" y="794">place order from a priced cart</text><text class="box-title" x="759" y="814">Given</text><text x="759" y="829">evt CartPriced { cartId: &#34;c-100&#34;, total: 125.00 }</text><text class="box-title" x="759" y="844">When</text><text x="759" y="859">cmd PlaceOrder { cartId: &#34;c-100&#34;, customerId: &#34;cust-7&#34;, total: 125.00 }</text><text class="box-title" x="759" y="874">Then</text><text x="759" y="889">evt OrderPlaced { orderId: &#34;ord-100&#34;, customerId: &#34;cust-7&#34;, total: 125.00 }</text></g><g class="gwt"><rect x="749" y="908" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="759" y="926">reject order when cart has no priced items</text><text class="box-title" x="759" y="946">Given</text><text x="759" y="961">evt CartPriced { cartId: &#34;c-100&#34;, total: 0.00 }</text><text class="box-title" x="759" y="976">When</text><text x="759" y="991">cmd PlaceOrder { cartId: &#34;c-100&#34;, customerId: &#34;cust-7&#34;, total: 0.00 }</text><text class="box-title" x="759" y="1006">Then</text><text x="759" y="1021">evt OrderPlacementRejected { cartId: &#34;c-100&#34;, reason: &#34;empty_cart&#34; }</text></g><g class="gwt"><rect x="2366" y="776" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="2376" y="794">authorize payment for a newly placed order</text><text class="box-title" x="2376" y="814">Given</text><text x="2376" y="829">evt Sales.OrderPlaced { orderId: &#34;ord-100&#34;, total: 125.00 }</text><text class="box-title" x="2376" y="844">When</text><text x="2376" y="859">cmd AuthorizePayment { orderId: &#34;ord-100&#34;, amount: 125.00, paymentMethodId: &#34;pm-9&#34; }</text><text class="box-title" x="2376" y="874">Then</text><text x="2376" y="889">evt PaymentAuthorized { orderId: &#34;ord-100&#34;, authorizationId: &#34;auth-1&#34;, amount: 125.00 }</text></g><g class="gwt"><rect x="2366" y="908" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="2376" y="926">decline payment when issuer rejects the charge</text><text class="box-title" x="2376" y="946">Given</text><text x="2376" y="961">evt Sales.OrderPlaced { orderId: &#34;ord-100&#34;, total: 125.00 }</text><text class="box-title" x="2376" y="976">When</text><text x="2376" y="991">cmd AuthorizePayment { orderId: &#34;ord-100&#34;, amount: 125.00, paymentMethodId: &#34;pm-9&#34; }</text><text class="box-title" x="2376" y="1006">Then</text><text x="2376" y="1021">evt PaymentDeclined { orderId: &#34;ord-100&#34;, reason: &#34;issuer_declined&#34; }</text></g><g class="gwt"><rect x="4222" y="776" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4232" y="794">allocate shipment after payment is authorized</text><text class="box-title" x="4232" y="814">Given</text><text x="4232" y="829">evt Billing.PaymentAuthorized { orderId: &#34;ord-100&#34;, amount: 125.00 }</text><text class="box-title" x="4232" y="844">When</text><text x="4232" y="859">cmd AllocateShipment { orderId: &#34;ord-100&#34;, warehouseId: &#34;wh-1&#34; }</text><text class="box-title" x="4232" y="874">Then</text><text x="4232" y="889">evt ShipmentAllocated { orderId: &#34;ord-100&#34;, shipmentId: &#34;sh-55&#34;, warehouseId: &#34;wh-1&#34; }</text></g><g class="gwt"><rect x="4222" y="908" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4232" y="926">defer shipment when inventory is not available</text><text class="box-title" x="4232" y="946">Given</text><text x="4232" y="961">evt Billing.PaymentAuthorized { orderId: &#34;ord-100&#34;, amount: 125.00 }</text><text class="box-title" x="4232" y="976">When</text><text x="4232" y="991">cmd AllocateShipment { orderId: &#34;ord-100&#34;, warehouseId: &#34;wh-1&#34; }</text><text class="box-title" x="4232" y="1006">Then</text><text x="4232" y="1021">evt ShipmentAllocationDeferred { orderId: &#34;ord-100&#34;, reason: &#34;inventory_unavailable&#34; }</text></g><g class="gwt"><rect x="5957" y="776" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5967" y="794">cancel order after payment declines</text><text class="box-title" x="5967" y="814">Given</text><text x="5967" y="829">evt Billing.PaymentDeclined { orderId: &#34;ord-100&#34;, reason: &#34;insufficient_funds&#34; }</text><text class="box-title" x="5967" y="844">When</text><text x="5967" y="859">cmd CancelOrder { orderId: &#34;ord-100&#34;, reason: &#34;payment_declined&#34; }</text><text class="box-title" x="5967" y="874">Then</text><text x="5967" y="889">evt OrderCancelled { orderId: &#34;ord-100&#34;, reason: &#34;payment_declined&#34; }</text></g><g class="gwt"><rect x="5957" y="908" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5967" y="926">ignore cancellation when order is already cancelled</text><text class="box-title" x="5967" y="946">Given</text><text x="5967" y="961">evt OrderCancelled { orderId: &#34;ord-100&#34;, reason: &#34;payment_declined&#34; }</text><text class="box-title" x="5967" y="976">When</text><text x="5967" y="991">cmd CancelOrder { orderId: &#34;ord-100&#34;, reason: &#34;payment_declined&#34; }</text><text class="box-title" x="5967" y="1006">Then</text><text x="5967" y="1021">evt OrderCancellationIgnored { orderId: &#34;ord-100&#34;, reason: &#34;already_cancelled&#34; }</text></g></svg>