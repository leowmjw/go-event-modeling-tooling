e="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 3725.6 57.0 L 4970.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5170.4 205.0 L 5210.4 369.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5170.4 205.0 L 5414.8 369.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5374.8 369.0 L 5654.8 57.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 5796.4 57.0 L 5836.4 205.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6130.0 205.0 L 6170.0 369.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><path d="M 6506.8 369.0 L 6546.8 237.0" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#arrowhead)"/><g class="box"><rect x="220" y="40" width="187" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="232" y="62">StartApplicationScreen</text></g><g class="box"><rect x="447" y="180" width="272" height="114" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="459" y="202">ApplicationProgress</text><text class="code" x="459" y="222">applicationId: &#34;app-1001&#34;</text><text class="code" x="459" y="238">  customerId: &#34;cust-7&#34;</text><text class="code" x="459" y="254">  productCode: &#34;CHQ-STD&#34;</text><text class="code" x="459" y="270">  step: &#34;capture&#34;</text><text class="code" x="459" y="286">  submittedAt: &#34;2024-06-15T10:02:00Z&#34;</text></g><g class="box"><rect x="759" y="180" width="366" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="771" y="202">SubmitApplication</text><text class="code" x="771" y="222">ssnLast4, email, dob, productCode, sourceOfFunds</text></g><g class="box"><rect x="1165" y="344" width="387" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="1177" y="366">ApplicationSubmitted</text><text class="code" x="1177" y="386">applicationId, customerId, productCode, submittedAt</text></g><g class="box"><rect x="1592" y="40" width="120" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="1604" y="62">KYCProcessor</text></g><g class="box"><rect x="1752" y="180" width="294" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="1764" y="202">VerifyIdentity</text><text class="code" x="1764" y="222">applicationId, ssnLast4, dob, fullName</text></g><g class="box"><rect x="2086" y="344" width="200" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="2098" y="366">IdentityVerified</text><text class="code" x="2098" y="386">applicationId, verifiedAt</text></g><g class="box"><rect x="2326" y="344" width="218" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="2338" y="366">IdentityVerificationFailed</text><text class="code" x="2338" y="386">applicationId, reason</text></g><g class="box"><rect x="2583" y="180" width="286" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="2595" y="202">ScreenSanctionsList</text><text class="code" x="2595" y="222">fullName, dob, country, applicationId</text></g><g class="box"><rect x="2910" y="344" width="265" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="2922" y="366">SanctionsCheckCompleted</text><text class="code" x="2922" y="386">applicationId, hitList, screenedAt</text></g><g class="box"><rect x="3214" y="180" width="351" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="3226" y="202">IdentityCheckResult</text><text class="code" x="3226" y="222">applicationId, identityStatus, sanctionsStatus</text></g><g class="box"><rect x="3606" y="40" width="120" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="3618" y="62">RiskProcessor</text></g><g class="box"><rect x="3766" y="180" width="200" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="3778" y="202">ScoreApplication</text><text class="code" x="3778" y="222">applicationId, customerId</text></g><g class="box"><rect x="4006" y="344" width="258" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="4018" y="366">RiskScoreCalculated</text><text class="code" x="4018" y="386">applicationId, riskScore, drivers</text></g><g class="box"><rect x="4303" y="180" width="322" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4315" y="202">Decision</text><text class="code" x="4315" y="222">applicationId, decision, decidedAt, reason</text></g><g class="box"><rect x="4666" y="180" width="265" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4678" y="202">ApproveApplication</text><text class="code" x="4678" y="222">applicationId, approvedProductCode</text></g><g class="box"><rect x="4970" y="180" width="200" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="4982" y="202">RejectApplication</text><text class="code" x="4982" y="222">applicationId, reasonCode</text></g><g class="box"><rect x="5210" y="344" width="164" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5222" y="366">ApplicationApproved</text><text class="code" x="5222" y="386">applicationId</text></g><g class="box"><rect x="5415" y="344" width="200" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="5427" y="366">ApplicationRejected</text><text class="code" x="5427" y="386">applicationId, reasonCode</text></g><g class="box"><rect x="5655" y="40" width="142" height="34" rx="4" fill="#f8d4bc" stroke="#d38e5f"/><text class="box-title" x="5667" y="62">AccountActivator</text></g><g class="box"><rect x="5836" y="180" width="294" height="50" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="5848" y="202">OpenAccount</text><text class="code" x="5848" y="222">applicationId, customerId, productCode</text></g><g class="box"><rect x="6170" y="344" width="337" height="50" rx="4" fill="#d3f1a2" stroke="#84af49"/><text class="box-title" x="6182" y="366">AccountOpened</text><text class="code" x="6182" y="386">accountId, customerId, productCode, openedAt</text></g><g class="box"><rect x="6547" y="180" width="250" height="114" rx="4" fill="#bcd6fe" stroke="#679ac3"/><text class="box-title" x="6559" y="202">AccountCatalogue</text><text class="code" x="6559" y="222">accountId: &#34;acc-1001&#34;</text><text class="code" x="6559" y="238">  customerId: &#34;cust-7&#34;</text><text class="code" x="6559" y="254">  productCode: &#34;CHQ-STD&#34;</text><text class="code" x="6559" y="270">  status: &#34;open&#34;</text><text class="code" x="6559" y="286">  openedAt: &#34;2024-06-15T11:18:00Z&#34;</text></g><g class="slice"><rect x="220" y="464" width="6577" height="22" rx="3" fill="#c8e6c9" stroke="#4caf50"/><text class="slice-label" x="228" y="479">Happy-path instant approval</text><text class="slice-status" x="6707" y="479">Done</text></g><g class="slice"><rect x="3766" y="490" width="2364" height="22" rx="3" fill="#bbdefb" stroke="#2196f3"/><text class="slice-label" x="3774" y="505">Manual review queue</text><text class="slice-status" x="6040" y="505">InProgress</text></g><g class="slice"><rect x="2583" y="516" width="3547" height="22" rx="3" fill="#eceff1" stroke="#90a4ae"/><text class="slice-label" x="2591" y="531">PEP / sanctions escalation</text><text class="slice-status" x="6040" y="531">Planned</text></g><g class="hotspot"><rect x="759" y="558" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="769" y="576">Hotspot for SubmitApplication</text><text class="code" x="769" y="594">What is the source-of-funds disclosure required for amounts &gt; $10k?</text><text class="code" x="769" y="610">  Compliance needs to confirm whether SubmitApplication carries the</text><text class="code" x="769" y="626">  field today or whether it has to be re-prompted in the KYC step.</text></g><g class="hotspot"><rect x="4303" y="644" width="220" height="90" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="4313" y="662">Hotspot for Decision</text><text class="code" x="4313" y="680">When riskScore is in (60, 79], do we go to manual review or auto-decline?</text><text class="code" x="4313" y="696">  Operations wants auto-decline to reduce queue depth; Compliance wants</text><text class="code" x="4313" y="712">  review to avoid unfair declines. This affects the routing rule in</text><text class="code" x="4313" y="728">  RiskProcessor (frame 11).</text></g><g class="hotspot"><rect x="2583" y="746" width="220" height="90" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="2593" y="764">Hotspot for ScreenSanctionsList</text><text class="code" x="2593" y="782">Sanctions list version: daily OFAC refresh or real-time list feed?</text><text class="code" x="2593" y="798">  Real-time costs $14k/month in vendor fees; daily refresh misses</text><text class="code" x="2593" y="814">  intra-day additions. Default today is daily — needs explicit</text><text class="code" x="2593" y="830">  Compliance sign-off before production.</text></g><circle class="hotspot-pin" cx="4618" cy="188" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="2862" cy="188" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="1117" cy="188" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><g class="gwt"><rect x="759" y="868" width="240" height="180" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="769" y="886">happy path: clean applicant is approved instantly</text><text class="box-title" x="769" y="906">Given</text><text x="769" y="921">ui StartApplicationScreen</text><text class="box-title" x="769" y="936">When</text><text x="769" y="951">cmd SubmitApplication { ssnLast4: &#34;1234&#34;, dob: &#34;1990-01-01&#34;, productCode: &#34;CHQ-STD&#34; }</text><text class="box-title" x="769" y="966">Then</text><text x="769" y="981">evt ApplicationSubmitted</text><text x="769" y="996">evt IdentityVerified</text><text x="769" y="1011">evt SanctionsCheckCompleted { hitList: [] }</text><text x="769" y="1026">evt RiskScoreCalculated { riskScore: 12 }</text><text x="769" y="1041">evt ApplicationApproved</text></g><g class="gwt"><rect x="4970" y="868" width="240" height="150" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4980" y="886">reject when sanctions match is a positive hit</text><text class="box-title" x="4980" y="906">Given</text><text x="4980" y="921">evt ApplicationSubmitted { applicationId: &#34;app-1001&#34; }</text><text class="box-title" x="4980" y="936">When</text><text x="4980" y="951">cmd ScreenSanctionsList { fullName: &#34;Bad Actor&#34;, applicationId: &#34;app-1001&#34; }</text><text class="box-title" x="4980" y="966">Then</text><text x="4980" y="981">evt SanctionsCheckCompleted { hitList: [&#34;OFAC-SDN-9912&#34;] }</text><text x="4980" y="996">cmd RejectApplication { reasonCode: &#34;sanctions_match&#34; }</text><text x="4980" y="1011">evt ApplicationRejected</text></g><g class="gwt"><rect x="3766" y="868" width="240" height="135" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="3776" y="886">manual review when risk is borderline</text><text class="box-title" x="3776" y="906">Given</text><text x="3776" y="921">evt RiskScoreCalculated { riskScore: 71 }</text><text class="box-title" x="3776" y="936">When</text><text x="3776" y="951">cmd ScoreApplication</text><text class="box-title" x="3776" y="966">Then</text><text x="3776" y="981">rmo Decision { decision: &#34;manual_review&#34; }</text><text x="3776" y="996">rmo Decision { decidedAt: &#34;2024-06-15T11:00:00Z&#34; }</text></g><g class="gwt"><rect x="5836" y="868" width="240" height="120" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="5846" y="886">open account only after explicit approval event</text><text class="box-title" x="5846" y="906">Given</text><text x="5846" y="921">evt ApplicationApproved { applicationId: &#34;app-1001&#34; }</text><text class="box-title" x="5846" y="936">When</text><text x="5846" y="951">cmd OpenAccount { applicationId: &#34;app-1001&#34; }</text><text class="box-title" x="5846" y="966">Then</text><text x="5846" y="981">evt AccountOpened { accountId: &#34;acc-1001&#34; }</text></g></svg>