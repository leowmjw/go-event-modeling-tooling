stroke="#4caf50"/><text class="slice-label" x="228" y="619">Enrichment pipeline</text><text class="slice-status" x="2814" y="619">Done</text></g><g class="slice"><rect x="2944" y="630" width="1327" height="22" rx="3" fill="#bbdefb" stroke="#2196f3"/><text class="slice-label" x="2952" y="645">Real-time scoring</text><text class="slice-status" x="4180" y="645">InProgress</text></g><g class="slice"><rect x="4310" y="656" width="2454" height="22" rx="3" fill="#eceff1" stroke="#90a4ae"/><text class="slice-label" x="4318" y="671">Case management UI</text><text class="slice-status" x="6674" y="671">Planned</text></g><g class="slice"><rect x="7001" y="682" width="1846" height="22" rx="3" fill="#fff59d" stroke="#f9a825"/><text class="slice-label" x="7009" y="697">SAR filing integration</text><text class="slice-status" x="8757" y="697">Informational</text></g><g class="hotspot"><rect x="4522" y="724" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="4532" y="742">Hotspot for AutoBlockTransaction</text><text class="code" x="4532" y="760">When model score is in (0.6, 0.8], auto-block or alert? Risk wants</text><text class="code" x="4532" y="776">  alert (less customer friction); Ops wants block (less manual review).</text><text class="code" x="4532" y="792">  The DispositionProcessor (frame 15) needs an explicit policy rule.</text></g><g class="hotspot"><rect x="7198" y="810" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="7208" y="828">Hotspot for PrepareSAR</text><text class="code" x="7208" y="846">SAR filing — automate via FinCEN BSA E-Filing API or keep manual?</text><text class="code" x="7208" y="862">  Compliance officer needs to sign off. Today this is a manual upload</text><text class="code" x="7208" y="878">  once a week by the BSA officer.</text></g><g class="hotspot"><rect x="3163" y="896" width="220" height="74" rx="4" fill="#fde8e8" stroke="#e57373"/><text x="3173" y="914">Hotspot for ScoreTransaction</text><text class="code" x="3173" y="932">Fraud model is currently XGBoost v3.2, retrained monthly. Drift</text><text class="code" x="3173" y="948">  detection flagged 0.04 AUC drop in March. Should we move to weekly</text><text class="code" x="3173" y="964">  retraining or accept the drift? This affects ScoreTransaction SLA.</text></g><circle class="hotspot-pin" cx="4686" cy="328" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="7519" cy="328" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><circle class="hotspot-pin" cx="3355" cy="328" r="6" fill="#e53935" stroke="#fff" stroke-width="1.5"/><g class="gwt"><rect x="3163" y="1002" width="240" height="150" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="3173" y="1020">high-score transaction is auto-blocked</text><text class="box-title" x="3173" y="1040">Given</text><text x="3173" y="1055">evt EnrichmentBundle { txnId: &#34;txn-9901&#34; }</text><text class="box-title" x="3173" y="1070">When</text><text x="3173" y="1085">cmd ScoreTransaction</text><text class="box-title" x="3173" y="1100">Then</text><text x="3173" y="1115">evt FraudScoreComputed { score: 0.94 }</text><text x="3173" y="1130">cmd AutoBlockTransaction</text><text x="3173" y="1145">evt TransactionBlocked</text></g><g class="gwt"><rect x="4960" y="1002" width="240" height="150" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="4970" y="1020">medium-score transaction opens a case for analyst review</text><text class="box-title" x="4970" y="1040">Given</text><text x="4970" y="1055">evt FraudScoreComputed { score: 0.72 }</text><text class="box-title" x="4970" y="1070">When</text><text x="4970" y="1085">cmd CreateAlert</text><text class="box-title" x="4970" y="1100">Then</text><text x="4970" y="1115">evt AlertCreated { alertId: &#34;alert-44&#34; }</text><text x="4970" y="1130">cmd OpenCase { analystId: &#34;bsa-001&#34;, severity: &#34;high&#34; }</text><text x="4970" y="1145">evt CaseOpened</text></g><g class="gwt"><rect x="6175" y="1002" width="240" height="150" rx="4" fill="#f8f8f8" stroke="#bbbbbb"/><text x="6185" y="1020">escalate confirmed money mule to SAR filing</text><text class="box-title" x="6185" y="1040">Given</text><text x="6185" y="1055">evt CaseOpened { caseId: &#34;case-91&#34; }</text><text class="box-title" x="6185" y="1070">When</text><text x="6185" y="1085">cmd EscalateCaseToSAR { narrativeId: &#34;narr-91&#34; }</text><text class="box-title" x="6185" y="1100">Then</text><text x="6185" y="1115">cmd PrepareSAR { caseId: &#34;case-91&#34; }</text><text x="6185" y="1130">evt External.SARSubmitted</text><text x="6185" y="1145">evt SARFiled { regulator: &#34;FinCEN&#34; }</text></g></svg>