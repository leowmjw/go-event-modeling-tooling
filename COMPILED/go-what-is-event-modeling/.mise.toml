[tools]
go = "latest"
overmind = "latest"
[tasks.doctor]
run = '''
set -eu
go version
mise exec -- overmind --version
tmux -V
"$HOME/go/bin/temporal" --version
go mod verify
for file in Procfile go.mod go.sum model.json cmd/worker/main.go cmd/starter/main.go cmd/book-room/main.go cmd/check-in/main.go cmd/check-out/main.go; do test -f "$file"; done
'''
[tasks.check]
run = '''
set -eu
test -z "$(gofmt -l .)"
go mod tidy -diff
go test -race ./...
go vet ./...
'''
[tasks.demo]
run = "mise exec -- overmind start -f Procfile"
[tasks."demo:stop"]
run = "mise exec -- overmind quit"
[tasks.start]
run = "go run ./cmd/starter"
[tasks.book]
run = "go run ./cmd/book-room"
[tasks.checkin]
run = "go run ./cmd/check-in"
[tasks.checkout]
run = "go run ./cmd/check-out"
[tasks.room-list]
run = '"$HOME/go/bin/temporal" workflow query --workflow-id hotel-booking-b-1 --type room_list'
