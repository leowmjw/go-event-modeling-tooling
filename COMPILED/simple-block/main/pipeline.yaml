name: simple-block-main
version: 1.0.0
description: Add a catalog item and project the resulting catalog.
input:
  type: AddItemCommand
  required: [itemId, description, image, price]
  input_schema:
    type: object
    properties:
      itemId: {type: string}
      description: {type: string}
      image: {type: string}
      price: {type: number}
      priorEvents:
        type: array
        items: {type: object}
    required: [itemId, description, image, price]
nodes:
  - id: decide_add_item
    kind: pure_function
    description: Validate and add an item.
    source: {section: "tf 02 cmd AddItem"}
    impl: extracted/main.py:decide_add_item
    input: &add_inputs
      command: pipeline.input
      prior_events: pipeline.input.priorEvents
    inputs: *add_inputs
    output:
      result: AddItemResult
    mandatory: true
  - id: project_item_catalog
    kind: pure_function
    description: Project ItemAdded into the item catalog.
    source: {section: "tf 04 rmo ItemCatalog"}
    impl: extracted/main.py:project_item_catalog
    input: &catalog_inputs
      result: decide_add_item.output
    inputs: *catalog_inputs
    output:
      view: ItemCatalog
    mandatory: true
edges:
  - {from: decide_add_item, to: project_item_catalog}
entry_nodes: [decide_add_item]
exit_nodes: [project_item_catalog]
